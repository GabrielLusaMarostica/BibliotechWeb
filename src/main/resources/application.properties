server.port=8080
spring.main.banner-mode=off

# memoria (padrão: sem banco, com dados de demonstração) ou jdbc (MySQL)
bibliotech.modo=${BIBLIOTECH_MODO:memoria}
bibliotech.admin.login=${BIBLIOTECH_ADMIN_LOGIN:admin}
# Em modo jdbc, defina BIBLIOTECH_ADMIN_SENHA para criar o primeiro usuário. Em memória o padrão é admin123.
bibliotech.admin.senha=${BIBLIOTECH_ADMIN_SENHA:}
