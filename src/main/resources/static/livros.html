<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livros – Bibliotech</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="layout">
  <aside id="menu"></aside>
  <main class="conteudo" id="principal">
    <header class="cabecalho-pagina">
      <div><h1>Livros</h1><p>Acervo e controle de estoque.</p></div>
      <button class="botao" type="button" id="btn-novo">+ Novo livro</button>
    </header>
    <section class="cartao" aria-label="Lista de livros">
      <div class="barra-ferramentas">
        <label class="sr-only" for="busca">Buscar</label>
        <input type="search" id="busca" placeholder="Buscar..." autocomplete="off">
        <span id="contador" aria-live="polite"></span>
      </div>
      <div class="tabela-rolavel">
        <table>
          <thead><tr><th scope="col">Título</th><th scope="col">Autor</th><th scope="col">Gênero</th><th scope="col">Ano</th><th scope="col">Estoque</th><th scope="col">Ações</th></tr></thead>
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<dialog id="dialogo-form" aria-labelledby="titulo-dialogo">
  <h2 id="titulo-dialogo"></h2>
  <form id="form-cadastro" novalidate>
    <div class="campo">
      <label for="titulo">Título</label>
      <input id="titulo" name="titulo" type="text" >
      <span class="erro" role="alert"></span>
    </div>
    <div class="campo">
      <label for="autor">Autor</label>
      <input id="autor" name="autor" type="text" >
      <span class="erro" role="alert"></span>
    </div>
    <div class="campo">
      <label for="genero">Gênero</label>
      <input id="genero" name="genero" type="text" >
      <span class="ajuda">Opcional.</span><span class="erro" role="alert"></span>
    </div>
    <div class="campo">
      <label for="ano">Ano de publicação</label>
      <input id="ano" name="ano" type="text" inputmode="numeric">
      <span class="ajuda">4 dígitos.</span><span class="erro" role="alert"></span>
    </div>
    <div class="campo">
      <label for="quantidade">Quantidade em estoque</label>
      <input id="quantidade" name="quantidade" type="number" min="0" step="1">
      <span class="erro" role="alert"></span>
    </div>
    <div class="acoes-form">
      <button type="button" class="botao secundario" id="btn-cancelar">Cancelar</button>
      <button type="submit" class="botao">Salvar</button>
    </div>
  </form>
</dialog>

<script src="js/api.js"></script>
<script src="js/validacao.js"></script>
<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script src="js/livros.js"></script>
</body>
</html>
