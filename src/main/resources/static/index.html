<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar – Bibliotech</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="pagina-login" data-publica="true">
  <main class="caixa-login">
    <div class="logo">▣ Biblio<span>tech</span></div>
    <p class="subtitulo">Sistema de gerenciamento da biblioteca escolar</p>
    <form id="form-login" novalidate>
      <div class="campo">
        <label for="login">Usuário</label>
        <input id="login" name="login" type="text" autocomplete="username" autofocus>
        <span class="erro" role="alert"></span>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <div class="senha-linha">
          <input id="senha" name="senha" type="password" autocomplete="current-password">
          <button type="button" class="botao secundario pequeno" id="mostrar-senha" aria-pressed="false">Mostrar</button>
        </div>
        <span class="erro" role="alert"></span>
      </div>
      <p class="erro" id="erro-login" role="alert" style="color:var(--cor-erro);min-height:1.2em"></p>
      <button class="botao" type="submit">Entrar</button>
    </form>
    <p class="dica-demo"><strong>Modo demonstração:</strong> sem banco configurado, o servidor sobe com o usuário <code>admin</code> / <code>admin123</code>. Com MySQL, o usuário é o definido em <code>BIBLIOTECH_ADMIN_SENHA</code>.</p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/validacao.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
