<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alunos – Bibliotech</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="layout">
  <aside id="menu"></aside>
  <main class="conteudo" id="principal">
    <header class="cabecalho-pagina">
      <div><h1>Alunos</h1><p>Cadastro e consulta de alunos da biblioteca.</p></div>
      <button class="botao" type="button" id="btn-novo">+ Novo aluno</button>
    </header>
    <section class="cartao" aria-label="Lista de alunos">
      <div class="barra-ferramentas">
        <label class="sr-only" for="busca">Buscar</label>
        <input type="search" id="busca" placeholder="Buscar..." autocomplete="off">
        <span id="contador" aria-live="polite"></span>
      </div>
      <div class="tabela-rolavel">
        <table>
          <thead><tr><th scope="col">Nome</th><th scope="col">Matrícula</th><th scope="col">Série</th><th scope="col">Contato</th><th scope="col">Ações</th></tr></thead>
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<dialog id="dialogo-form" aria-labelledby="titulo-dialogo">
  <h2 id="titulo-dialogo"></h2>
  <form id="form-cadastro" novalidate>
    <div class="campo">
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" type="text" autocomplete="off">
      <span class="erro" role="alert"></span>
    </div>
    <div class="campo">
      <label for="matricula">Matrícula</label>
      <input id="matricula" name="matricula" type="text" >
      <span class="ajuda">Letras e números, sem espaços. Não pode repetir.</span><span class="erro" role="alert"></span>
    </div>
    <div class="campo">
      <label for="serie">Série</label>
      <input id="serie" name="serie" type="text" >
      <span class="ajuda">Ex.: 3º ano A (opcional).</span><span class="erro" role="alert"></span>
    </div>
    <div class="campo">
      <label for="contato">Contato</label>
      <input id="contato" name="contato" type="text" autocomplete="off">
      <span class="ajuda">E-mail ou telefone (opcional).</span><span class="erro" role="alert"></span>
    </div>
    <div class="acoes-form">
      <button type="button" class="botao secundario" id="btn-cancelar">Cancelar</button>
      <button type="submit" class="botao">Salvar</button>
    </div>
  </form>
</dialog>

<script src="js/api.js"></script>
<script src="js/validacao.js"></script>
<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script src="js/alunos.js"></script>
</body>
</html>
